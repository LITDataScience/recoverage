[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverage"
version = "0.1.0"
description = "Project-agnostic agentic code coverage: measure, score, explain gaps, draft tests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Recoverage" }]
dependencies = [
  "coverage>=7.6",
  "matplotlib>=3.8",
  "hypothesis>=6.100",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
recoverage = "recoverage.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recoverage = ["py.typed", "RUBRIC.md", "templates/report.typ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
