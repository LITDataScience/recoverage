name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest

  release-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tag matches version.py
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/recoverage/version.py', encoding='utf-8').read()).group(1))")
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          test "$tag" = "v$version"
      - name: Build and inspect distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install dist/*.whl
          /tmp/wheel-smoke/bin/python -c "import recoverage; print(recoverage.__version__)"
          /tmp/wheel-smoke/bin/recoverage --version
          python - <<'PY'
          import tarfile, zipfile
          from pathlib import Path
          banned = ("BEGIN PRIVATE KEY", "AKIA", "ghp_", "RECOVERAGE_LLM_API_KEY")
          for path in Path("dist").iterdir():
              if path.suffix == ".whl":
                  names = zipfile.ZipFile(path).namelist()
              else:
                  names = tarfile.open(path).getnames()
              print(path.name)
              for name in names:
                  print(" ", name)
              blob = path.read_bytes()
              for token in banned:
                  if token.encode() in blob:
                      raise SystemExit(f"secret-shaped token {token} in {path}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
