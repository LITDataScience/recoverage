# Copy this file to .github/workflows/recoverage.yml after the project
# installs Recoverage. The job fails when the gate is below the threshold.
name: recoverage

on:
  pull_request:
  push:
    branches: [main]

jobs:
  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the project and Recoverage
        run: |
          python -m pip install -U pip
          # From a checkout of this repo: pip install -e .
          # Once the package is published: pip install coderecoverage
          pip install coderecoverage
          # Install the repo under test and its test dependencies, for example:
          #   pip install -e ".[test]"
      - name: Recoverage gate
        run: recoverage run . --output recoverage-out --no-llm --threshold merge-ready
      # analysis.json is scrubbed (basename paths, blank docstrings, type-name
      # search args) and still holds relative paths and gap text. Drop it from
      # this upload if the artifact store is wider than repo read access.
      # See docs/reports.md and docs/security.md.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recoverage-report
          path: |
            recoverage-out/report.md
            recoverage-out/report.pdf
            recoverage-out/charts
            recoverage-out/analysis.json
